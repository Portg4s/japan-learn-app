<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c73e3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
    rel="stylesheet"
  />
  <script>
    // PWA service worker — uniquement en production.
    // En dev (localhost / proxy Freebuff), on le désactive pour ne jamais
    // servir de modules périmés depuis le cache.
    if ('serviceWorker' in navigator) {
      var isDevHost = /localhost|127\.0\.0\.1|daytonaproxy|vly\.sh/.test(window.location.hostname);
      window.addEventListener('load', function () {
        if (isDevHost) {
          // Nettoie un éventuel ancien worker pour ne pas casser le dev
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
        } else {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        }
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
